name: app_minimizer
description: A plugin can minimize app.
version: 1.0.1+6
repository: https://github.com/yohom/app_minimizer

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.codecity.flutter_app_minimizer
        pluginClass: FlutterAppMinimizerPlugin
      ios:
        pluginClass: SwiftFlutterAppMinimizerPlugin
